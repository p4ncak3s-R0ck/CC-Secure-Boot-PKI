name: Nightly JAR

on:
  schedule:
    # Every night at 3:00 AM UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check for changes since previous nightly
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.repository.default_branch;
            const currentSha = context.sha;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "nightly.yml",
              branch,
              status: "completed",
              per_page: 10
            });

            // Find an older run, ignoring the current one.
            const previousRun = runs.data.workflow_runs.find(
              run => run.id !== context.runId
            );

            if (!previousRun) {
              console.log("No previous nightly run found. Building.");
              core.setOutput("changed", "true");
              return;
            }

            console.log(`Current SHA:  ${currentSha}`);
            console.log(`Previous SHA: ${previousRun.head_sha}`);

            const changed = currentSha !== previousRun.head_sha;

            console.log(
              changed
                ? "Repository changed since previous nightly."
                : "No changes since previous nightly."
            );

            core.setOutput("changed", changed ? "true" : "false");

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew build

      - name: Determine artifact information
        id: artifact
        shell: bash
        run: |
          NAME=$(./gradlew properties -q --console=plain | awk -F': ' '$1 == "name" { print $2; exit }')
          VERSION=$(./gradlew properties -q --console=plain | awk -F': ' '$1 == "version" { print $2; exit }')
          HASH=$(git rev-parse --short=7 HEAD)

          FILENAME="${NAME}-${VERSION}-${HASH}.jar"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          echo "Artifact filename: $FILENAME"

      - name: Rename JAR
        shell: bash
        run: |
          JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-plain.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No suitable JAR found in build/libs"
            exit 1
          fi

          echo "Renaming $JAR"
          mv "$JAR" "build/libs/${{ steps.artifact.outputs.filename }}"

      - name: Upload nightly JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: build/libs/${{ steps.artifact.outputs.filename }}
          if-no-files-found: error